<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — CampusCare</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-panel">
    <div class="auth-panel-logo">
      <div class="auth-panel-icon">🏫</div>
      <h1>CampusCare</h1>
      <p>Join your campus community — report issues, track progress, keep things working.</p>
      <div class="auth-dots">
        <span></span>
        <span class="active"></span>
        <span></span>
      </div>
    </div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-card">
      <a href="/student/login.html" class="auth-back">← Back to login</a>
      <h2>Create account</h2>
      <p class="subtitle">Register to start reporting campus issues</p>

      <div class="alert alert-error"   id="errMsg"></div>
      <div class="alert alert-success" id="sucMsg"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name"/>
      </div>
      <div class="form-group">
        <label>College Email</label>
        <input type="email" id="email" placeholder="you@college.edu"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters"/>
      </div>

      <button class="btn btn-primary" onclick="register()">Create Account</button>

      <div class="auth-footer">
        Already have an account? <a href="/student/login.html">Login here</a>
      </div>
    </div>
  </div>
</div>

<script>
async function register() {
  const name     = document.getElementById('name').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('errMsg');
  const suc = document.getElementById('sucMsg');
  err.style.display = 'none'; suc.style.display = 'none';

  if (!name || !email || !password) {
    err.textContent = 'Please fill in all fields.'; err.style.display = 'block'; return;
  }
  if (password.length < 6) {
    err.textContent = 'Password must be at least 6 characters.'; err.style.display = 'block'; return;
  }

  const res  = await fetch('/api/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, email, password })
  });
  const data = await res.json();

  if (data.success) {
    suc.textContent = 'Registered successfully! Redirecting to login…';
    suc.style.display = 'block';
    setTimeout(() => window.location.href = '/student/login.html', 1600);
  } else {
    err.textContent = data.error || 'Registration failed.'; err.style.display = 'block';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
</script>
</body>
</html>
