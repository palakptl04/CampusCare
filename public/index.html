<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campus Issue Tracker</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.07) 0%, transparent 55%),
        var(--bg);
    }
    .hero { max-width: 500px; width: 100%; text-align: center; }
    .hero-icon {
      width: 64px; height: 64px; background: var(--accent);
      border-radius: 16px; display: flex; align-items: center;
      justify-content: center; font-size: 30px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 28px rgba(59,130,246,0.3);
    }
    .hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--muted2); font-size: 14px; margin-bottom: 36px; line-height: 1.65; }
    .role-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .role-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 14px;
      cursor: pointer;
      transition: all 0.18s;
      text-decoration: none;
      display: block;
    }
    .role-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(59,130,246,0.15);
      text-decoration: none;
    }
    .role-card .rc-icon { font-size: 26px; margin-bottom: 10px; }
    .role-card .rc-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .role-card .rc-desc  { font-size: 11.5px; color: var(--muted); }
    .hint { margin-top: 20px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-icon">🏫</div>
    <h1>Campus <span>Issue Tracker</span></h1>
    <p>Report and resolve campus problems — broken lights, cleanliness, water leakage, equipment issues and more.</p>
    <div class="role-grid">
      <a href="/student/login.html" class="role-card">
        <div class="rc-icon">🎓</div>
        <div class="rc-title">Student</div>
        <div class="rc-desc">Report & track issues</div>
      </a>
      <a href="/admin/login.html" class="role-card">
        <div class="rc-icon">🛡️</div>
        <div class="rc-title">Admin</div>
        <div class="rc-desc">Manage & assign issues</div>
      </a>
      <a href="/maintenance/login.html" class="role-card">
        <div class="rc-icon">🔧</div>
        <div class="rc-title">Staff</div>
        <div class="rc-desc">Resolve assigned issues</div>
      </a>
    </div>
    <p class="hint">Select your role to continue</p>
  </div>
</body>
</html>
