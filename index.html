<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusCare — Campus Issue Tracker</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-icon">🏫</div>
    <h1>Welcome to <em>CampusCare</em></h1>
    <p>Report broken lights, cleanliness concerns, water leakage, or equipment problems — and track them getting fixed.</p>

    <div class="role-grid">
      <a href="/student/login.html" class="role-card">
        <div class="rc-icon">🎓</div>
        <div class="rc-title">Student</div>
        <div class="rc-desc">Report & track issues</div>
      </a>
      <a href="/admin/login.html" class="role-card">
        <div class="rc-icon">🛡️</div>
        <div class="rc-title">Admin</div>
        <div class="rc-desc">Manage & assign issues</div>
      </a>
      <a href="/maintenance/login.html" class="role-card">
        <div class="rc-icon">🔧</div>
        <div class="rc-title">Staff</div>
        <div class="rc-desc">Resolve assigned issues</div>
      </a>
    </div>

    <p class="hint">Select your role to get started</p>
  </div>
</body>
</html>
