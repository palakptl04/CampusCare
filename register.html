<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Register – Campus Issue Tracker</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="icon">🏫</div>
        <span>Campus Issue Tracker<small>Student Registration</small></span>
      </div>
      <h2>Create Account</h2>
      <p class="subtitle">Register to start reporting campus issues</p>

      <div class="error-msg" id="errMsg"></div>
      <div class="success-msg" id="sucMsg"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name"/>
      </div>
      <div class="form-group">
        <label>College Email</label>
        <input type="email" id="email" placeholder="you@college.edu"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters"/>
      </div>

      <button class="btn btn-primary" onclick="register()">Create Account</button>

      <div class="auth-footer">
        Already have an account? <a href="/student/login.html">Login here</a>
      </div>
    </div>
  </div>

  <script>
    async function register() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('errMsg');
      const suc = document.getElementById('sucMsg');

      err.style.display = 'none';
      suc.style.display = 'none';

      if (!name || !email || !password) {
        err.textContent = 'Please fill in all fields.';
        err.style.display = 'block';
        return;
      }
      if (password.length < 6) {
        err.textContent = 'Password must be at least 6 characters.';
        err.style.display = 'block';
        return;
      }

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();

      if (data.success) {
        suc.textContent = '✅ Registered successfully! Redirecting to login...';
        suc.style.display = 'block';
        setTimeout(() => window.location.href = '/student/login.html', 1500);
      } else {
        err.textContent = data.error || 'Registration failed.';
        err.style.display = 'block';
      }
    }
  </script>
</body>
</html>
